<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            color: #333;
            margin: 0 0 20px;
        }
        .image-container {
            text-align: center;
        }
        img {
            width: 25%;
            min-width: 200px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .caption {
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>ROHIRAT</h1>
    <div class="image-container">
        <img src="https://akm-img-a-in.tosshub.com/indiatoday/images/story/202407/virat-kohli--rohit-sharma-013658445-3x4_0.jpg?VersionId=N1k9dz7d9PDZ8jWtTI6m2sTVLiK3nMnm" alt="Virat Kohli and Rohit Sharma">
        <div class="caption">This is an image of Virat Kohli and Rohit Sharma.</div>
    </div>
</body>
</html>
